<body class="auc cam">
  <!-- Lobby: faci o cameră sau intri cu un cod -->
  <section id="screen-setup" class="screen is-active" aria-labelledby="k-title">
    <header class="brand-bar">
      <div class="brand-left">
        <a class="brand-logo" href="index.html" aria-label="FRQ, meniul principal"><img src="img/frq-logo.png" alt="FRQ" width="115" height="28"></a>
        <a class="back-btn" href="index.html#online">&larr; Jocuri</a>
      </div>
    </header>
    <div class="start">
      <span class="skew-bar" aria-hidden="true"></span>
      <p class="eyebrow">Jocuri FRQ &middot; Online</p>
      <h1 id="k-title" class="logo">Licitația<span>cu un prieten</span></h1>
      <div id="k-lobby"></div>
    </div>
  </section>

  <!-- Jocul -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-left">
        <img class="hud-logo" src="img/frq-logo.png" alt="FRQ" width="82" height="20">
        <a class="back-btn" href="index.html#online">&larr; Ieși</a>
      </div>
      <div class="hud-cat"><span class="hud-k" id="k-phase-k"></span><span class="hud-cat-name" id="k-phase"></span></div>
      <div class="hud-scores"><span class="cam-cod" id="k-cod"></span></div>
    </header>
    <div class="cam-ceas"><i id="k-ceas"></i></div>
    <main class="auc-stage" id="k-stage"></main>
  </section>

  <script src="i18n.js"></script>
  <script src="data/cars.js"></script>
  <script src="shared.js"></script>
  <script src="kinds.js"></script>
  <script src="grades.js"></script>
  <script src="licitatie-model.js"></script>
  <script src="draft-model.js"></script>
  <script src="sus-model.js"></script>
  <script src="ordine-model.js"></script>
  <script src="rand-model.js"></script>
  <script src="frq-cloud.js"></script>
  <script src="camera.js"></script>
</body>
