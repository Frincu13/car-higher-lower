<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sus sau Jos | FRQ</title>
  <meta name="description" content="Ghicește care mașină are mai mulți cai putere, e mai grea sau prinde mai repede suta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Start screen -->
  <section id="screen-start" class="screen is-active" aria-labelledby="title">
    <header class="brand-bar">
      <div class="brand-left">
        <a class="brand-logo" href="index.html" aria-label="FRQ, toate jocurile"><img src="img/frq-logo.png" alt="FRQ" width="115" height="28"></a>
        <a class="back-btn" href="index.html">&larr; Jocuri</a>
      </div>
    </header>
    <div class="start">
      <span class="skew-bar" aria-hidden="true"></span>
      <p class="eyebrow">Jocuri FRQ</p>
      <h1 id="title" class="logo">Sus<span>sau</span>jos</h1>
      <p class="lede">Următoarea mașină stă mai sus sau mai jos? O greșeală și s-a terminat.</p>

      <h2 class="label">Categorie</h2>
      <div class="categories" id="categories" role="radiogroup" aria-label="Categorie"></div>

      <div class="start-actions">
        <button class="btn btn-primary" id="btn-play">Start</button>
        <button class="btn btn-ghost" id="btn-daily">Provocarea zilei</button>      </div>
    </div>
  </section>

  <!-- Game screen -->
  <section id="screen-game" class="screen" aria-live="polite">
    <header class="hud">
      <div class="hud-left">
        <img class="hud-logo" src="img/frq-logo.png" alt="FRQ" width="82" height="20">
        <button class="back-btn" id="btn-quit" type="button" aria-label="Înapoi la meniul jocului">&larr; Meniu</button>
      </div>
      <div class="hud-cat" id="hud-cat"></div>
      <div class="hud-scores">
        <div><span class="hud-k">Scor</span><span class="hud-v" id="hud-score">0</span></div>
        <div><span class="hud-k">Record</span><span class="hud-v" id="hud-best">0</span></div>
      </div>
    </header>

    <div class="arena" id="arena">
      <article class="card" id="card-left"></article>
      <div class="vs" id="vs" aria-hidden="true"><span>VS</span></div>
      <article class="card" id="card-right"></article>
    </div>
  </section>

  <!-- Game over -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="over-title">
      <p class="eyebrow" id="over-kicker">Final de cursă</p>
      <h2 id="over-title" class="over-score">0</h2>
      <p class="over-sub" id="over-sub"></p>
      <div class="over-reveal" id="over-reveal"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-again">Din nou</button>
        <button class="btn btn-ghost" id="btn-share" hidden>Copiază scorul</button>
        <button class="btn btn-ghost" id="btn-menu">Meniu</button>
      </div>
    </div>
  </div>

  <script src="data/cars.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
